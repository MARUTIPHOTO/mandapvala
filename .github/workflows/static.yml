# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Static Site
        run: |
          mkdir -p _site
          cp -r index.html _site/
          [ -d images ] && cp -r images _site/ || true
          [ -d view ] && cp -r view _site/ || true
          [ -d public ] && cp -r public _site/ || true
          [ -f catalog.html ] && cp catalog.html _site/ || true
          [ -f gallery.html ] && cp gallery.html _site/ || true
          [ -f MandapVala.apk ] && cp MandapVala.apk _site/ || true
          [ -f MandapVala.aab ] && cp MandapVala.aab _site/ || true
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only static site files
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
