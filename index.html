<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandap Vala - Event & Decoration Portal</title>
  <meta name="description" content="Mandap Vala - Customer Decoration Catalog Portal">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #4A0E17 0%, #800020 50%, #2A080C 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .card {
      background: #FFFFFF;
      color: #1F2937;
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #FEF3C7;
      color: #B45309;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      color: #800020;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-gold {
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.35);
    }
    .btn-gold:hover {
      box-shadow: 0 8px 24px rgba(180, 83, 9, 0.5);
    }
    .info-box {
      margin-top: 18px;
      background: #F9FAFB;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: #6B7280;
      line-height: 1.6;
      text-align: left;
    }
    .info-box strong {
      color: #111827;
    }
    .icon {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">🎪 Event & Mandap Services</span>
    <h1>Mandap Vala</h1>
    <p class="subtitle">તમામ ડેકોરેશન કેટલોગનું ઓનલાઇન પોર્ટલ</p>

    <!-- Customer Selection Catalog -->
    <a href="./catalog.html" id="catalogBtn" class="btn btn-gold">
      <span class="icon">✨</span>
      <span>કસ્ટમર ડેકોરેશન કેટલોગ જુઓ</span>
    </a>

    <div class="info-box">
      <strong>💡 ગ્રાહકો માટે:</strong> કસ્ટમર કેટલોગ બટન પર ક્લિક કરીને સીધું જ મંડપ, સ્ટેજ અને સોફા સિલેક્શન કરીને WhatsApp પર મોકલી શકાય છે.
    </div>
  </div>

  <script>
    // If customer parameters are passed (cname, phone, cust, biz), forward straight to catalog.html
    const searchParams = window.location.search;
    if (searchParams && (searchParams.includes('cname') || searchParams.includes('phone') || searchParams.includes('cust') || searchParams.includes('biz'))) {
      window.location.replace('./catalog.html' + searchParams);
    } else if (searchParams) {
      const btn = document.getElementById('catalogBtn');
      if (btn) btn.href = './catalog.html' + searchParams;
    }
  </script>
</body>
</html>
